name: Tests

# test: the host tests of this chip's clock limits (tests/CMakeLists.txt): most checks are static_asserts, so building
# is the test. Also generates the G17A SVD from chip.svd (python) and runs the write-only guard over it and chip.svd.
# They compile src/chip/ClockLimits.hpp against the src/chip/atsam_common submodule at the commit this repository
# records, and fetch Kvasir_SDK (its src/ headers and svd_converter) themselves.
# conformance: the chip's conformance tree (tests/conformance), Kvasir_SDK package-conformance.yml.

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    test:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-host-tests.yml@master
        with: {extra-packages: python, submodules: 'true'}

    conformance:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-conformance.yml@master
        with: {variants: '["ATSAMC21E17A","ATSAMC21G17A"]'}

    # the include layering of this repository against Kvasir_SDK tools/layers.toml (any finding fails)
    layers:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-layers.yml@master

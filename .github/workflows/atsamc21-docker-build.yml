name: Build and Push ATSAMC21 Container

# kvasirio/atsamc21: Kvasir_SDK's chip-image.yml builds it from Kvasir_SDK scripts/Dockerfile.chip with this repository
# as the context and sets the "ATSAMC21 Container Build" commit status. The file name is what Kvasir_SDK's
# dispatch-chip-images.yml dispatches after a new kvasirio/kvasir image or a kvasir_devices push.

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    image:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/chip-image.yml@master
        with: {chip: atsamc21, title: ATSAMC21}
        secrets: inherit
